name: Python tests and presentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.head_commit.message != 'Build presentation artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Generate presentation
        if: github.event_name == 'push'
        run: python build_presentation.py
      - name: Commit generated presentation
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentation.pptx
          git diff --cached --quiet || (git commit -m "Build presentation artifact" && git push)
